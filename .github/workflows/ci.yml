name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  validate:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Static Code Analysis (Linting)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Execute Automated Test Suite
        id: run_tests
        run: |
          pytest -v --tb=short demo_repo/tests/ tests/ 2>&1 | tee pytest_output.log

      - name: AutoHeal CI/CD — Webhook Ingestion & Autonomous Remediation
        if: failure()
        env:
          AUTOHEAL_URL: ${{ secrets.AUTOHEAL_URL || 'http://3.109.199.144:8000' }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          AUTHOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "================================================================="
          echo " CI FAILURE DETECTED: Triggering AutoHeal Platform on AWS EC2    "
          echo " Target Server: $AUTOHEAL_URL                                   "
          echo "================================================================="

          python -c '
import os, sys, json, urllib.request, subprocess

autoheal_url = os.environ.get("AUTOHEAL_URL", "http://3.109.199.144:8000").rstrip("/")
webhook_endpoint = f"{autoheal_url}/api/webhooks/github"

log_file = "pytest_output.log"
failure_logs = ""
if os.path.exists(log_file):
    with open(log_file, "r", encoding="utf-8", errors="replace") as f:
        failure_logs = f.read()

demo_file = "demo_repo/app.py"
demo_content = ""
if os.path.exists(demo_file):
    with open(demo_file, "r", encoding="utf-8", errors="replace") as f:
        demo_content = f.read()

lines_added = 20
lines_deleted = 5
files_changed = 1
try:
    diff_stat = subprocess.check_output(["git", "diff", "--shortstat", "HEAD~1", "HEAD"], text=True)
    import re
    m_files = re.search(r"(\d+)\s+file", diff_stat)
    m_ins = re.search(r"(\d+)\s+insertion", diff_stat)
    m_del = re.search(r"(\d+)\s+deletion", diff_stat)
    if m_files: files_changed = int(m_files.group(1))
    if m_ins: lines_added = int(m_ins.group(1))
    if m_del: lines_deleted = int(m_del.group(1))
except Exception:
    pass

payload = {
    "commit_sha": os.environ.get("COMMIT_SHA", "HEAD"),
    "commit_message": os.environ.get("COMMIT_MSG", "Pipeline failure"),
    "branch": os.environ.get("BRANCH", "main"),
    "author": os.environ.get("AUTHOR", "developer"),
    "repository": os.environ.get("REPO", "Jatinyadav22/predictive-self-healing-cicd"),
    "run_id": os.environ.get("RUN_ID", ""),
    "run_number": os.environ.get("RUN_NUMBER", ""),
    "run_url": f"https://github.com/{os.environ.get(\"REPO\", \"\")}/actions/runs/{os.environ.get(\"RUN_ID\", \"\")}",
    "failure_logs": failure_logs,
    "demo_app_content": demo_content,
    "lines_added": lines_added,
    "lines_deleted": lines_deleted,
    "files_changed": files_changed
}

print(f"Sending webhook to {webhook_endpoint} (Run ID: {payload[\"run_id\"]})...")
req = urllib.request.Request(
    webhook_endpoint,
    data=json.dumps(payload).encode("utf-8"),
    headers={"Content-Type": "application/json"}
)

try:
    with urllib.request.urlopen(req, timeout=120) as resp:
        res_data = resp.read().decode("utf-8")
        data = json.loads(res_data)
        print("AutoHeal Platform Response:")
        print(f"Status: {data.get(\"status\")}")
        print(f"RCA Summary: {data.get(\"rca_summary\")}")
        print(f"Risk Score: {data.get(\"risk_score\")}% ({data.get(\"risk_tier\")})")

        with open("autoheal_result.json", "w", encoding="utf-8") as f:
            f.write(res_data)
except Exception as e:
    print(f"::warning::Could not complete AutoHeal webhook request: {e}")
    sys.exit(1)
'

          # Check if AutoHeal generated and verified an autonomous fix
          python -c '
import os, sys, json, subprocess

if not os.path.exists("autoheal_result.json"):
    print("No AutoHeal result file found.")
    sys.exit(1)

with open("autoheal_result.json", "r", encoding="utf-8") as f:
    data = json.load(f)

status = data.get("status")
healed_code = data.get("healed_content")
target_file = data.get("target_file", "demo_repo/app.py")

if status == "RECOVERED_AUTOMATICALLY" and healed_code:
    print("=================================================================")
    print(" AUTOHEAL: Autonomous AST patch validated in sandbox!            ")
    print(f" Applying healed code to {target_file}...                       ")
    print("=================================================================")

    with open(target_file, "w", encoding="utf-8") as f:
