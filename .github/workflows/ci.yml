    res = subprocess.run(["pytest", "-v", "--tb=short", "demo_repo/tests/"], capture_output=True, text=True)
    if res.returncode == 0:
        print("Local verification PASSED! Committing and pushing healed commit...")
        subprocess.run(["git", "config", "user.name", "AutoHeal Bot"])
        subprocess.run(["git", "config", "user.email", "autoheal-bot@users.noreply.github.com"])
        subprocess.run(["git", "add", target_file])
        commit_msg = f"[AutoHeal] Self-healed commit {os.environ.get(\"COMMIT_SHA\", \"\")[:8]} (Autonomous AST Patch)"
        subprocess.run(["git", "commit", "-m", commit_msg])
