name: Order Billing Service CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml requests

      - name: Run Pytest Test Suite
        id: run_tests
        run: |
          set -o pipefail
          pytest -v --tb=short demo_repo/tests/ 2>&1 | tee pytest_output.log

      - name: AutoHeal CI/CD — Webhook Remediation
        if: failure()
        env:
          AUTOHEAL_URL: ${{ secrets.AUTOHEAL_URL || 'http://13.201.178.182:8000' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          AUTHOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/ci_webhook_remediation.py
